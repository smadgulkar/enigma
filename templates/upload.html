<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File - Enigma Web</title>
</head>
<body>
    <h1>Upload a File for Encryption/Decryption</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class=flashes style="list-style-type:none; padding:0;">
        {% for message in messages %}
          <li style="color: {% if 'Error' in message or 'No file' in message or 'not allowed' in message %}red{% else %}green{% endif %};">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_file_route') }}">
        <p><input type="file" name="file"></p>
        <p><input type="submit" value="Upload"></p>
    </form>

    <p><a href="{{ url_for('index') }}">Back to Home</a></p>
</body>
</html>
